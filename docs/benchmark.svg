<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Self-verify picks passing candidates more often than a random pick</title>
  <desc id="d">On tasks where 4 candidates disagree, a random pick passes the hidden tests 57.1% of the time on MBPP+ (130 tasks) and 64.2% on HumanEval+ (53 tasks). Self-verify with the DeepSeek verifier picks a passing candidate 68.5% and 75.5% of the time, a gain of 11.3 points on both.</desc>
  <style>
    .surface { fill: #fcfcfb; stroke: #e4e3df; }
    .ink { fill: #0b0b0b; }
    .ink2 { fill: #52514e; }
    .muted { fill: #76756f; }
    .grid { stroke: #e4e3df; stroke-width: 1; }
    .base { stroke: #b9b8b2; stroke-width: 1; }
    .random { fill: #a9a8a2; }
    .verify { fill: #2a78d6; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; stroke: #33332f; }
      .ink { fill: #f0efec; }
      .ink2 { fill: #c3c2b7; }
      .muted { fill: #9a998f; }
      .grid { stroke: #33332f; }
      .base { stroke: #5a5953; }
      .random { fill: #6b6a65; }
      .verify { fill: #3987e5; }
    }
    text { font-size: 13px; }
    .title { font-size: 18px; font-weight: 600; }
    .value { font-size: 14px; font-weight: 600; }
    .panel { font-size: 14px; font-weight: 600; }
    .small { font-size: 12px; }
  </style>

  <rect class="surface" x="0.5" y="0.5" width="719" height="389" rx="8"/>

  <text class="ink title" x="32" y="38">Self-verify picks a passing answer more often</text>
  <text class="ink2" x="32" y="60">Share of picks that pass the hidden tests, on tasks where the 4 candidates disagree</text>

  <rect class="random" x="32" y="78" width="12" height="12" rx="2"/>
  <text class="ink2" x="50" y="89">Random pick (no verifier)</text>
  <rect class="verify" x="228" y="78" width="12" height="12" rx="2"/>
  <text class="ink2" x="246" y="89">Self-verify (default DeepSeek verifier)</text>

  <!-- y(v) = 310 - 2v -->
  <line class="grid" x1="72" x2="688" y1="110" y2="110"/>
  <line class="grid" x1="72" x2="688" y1="160" y2="160"/>
  <line class="grid" x1="72" x2="688" y1="210" y2="210"/>
  <line class="grid" x1="72" x2="688" y1="260" y2="260"/>
  <line class="base" x1="72" x2="688" y1="310" y2="310"/>
  <text class="muted small" x="62" y="114" text-anchor="end">100%</text>
  <text class="muted small" x="62" y="164" text-anchor="end">75%</text>
  <text class="muted small" x="62" y="214" text-anchor="end">50%</text>
  <text class="muted small" x="62" y="264" text-anchor="end">25%</text>
  <text class="muted small" x="62" y="314" text-anchor="end">0%</text>

  <!-- MBPP+, centre x=230 -->
  <path class="random" d="M152 310 V199.8 Q152 195.8 156 195.8 H220 Q224 195.8 224 199.8 V310 Z"/>
  <path class="verify" d="M236 310 V177 Q236 173 240 173 H304 Q308 173 308 177 V310 Z"/>
  <text class="ink value" x="188" y="187.8" text-anchor="middle">57.1%</text>
  <text class="ink value" x="272" y="165" text-anchor="middle">68.5%</text>
  <text class="ink panel" x="230" y="334" text-anchor="middle">MBPP+ · 130 tasks</text>
  <text class="ink2 small" x="230" y="354" text-anchor="middle">+11.3 points (95% CI +2.5 to +17.7)</text>

  <!-- HumanEval+, centre x=530 -->
  <path class="random" d="M452 310 V185.6 Q452 181.6 456 181.6 H520 Q524 181.6 524 185.6 V310 Z"/>
  <path class="verify" d="M536 310 V163 Q536 159 540 159 H604 Q608 159 608 163 V310 Z"/>
  <text class="ink value" x="488" y="173.6" text-anchor="middle">64.2%</text>
  <text class="ink value" x="572" y="151" text-anchor="middle">75.5%</text>
  <text class="ink panel" x="530" y="334" text-anchor="middle">HumanEval+ · 53 tasks</text>
  <text class="ink2 small" x="530" y="354" text-anchor="middle">+11.3 points (95% CI −0.5 to +21.2)</text>

  <text class="muted small" x="32" y="378">Candidates: deepseek-flash, thinking off, 4 per task. Verifier: deepseek-flash, effort high. Reproduce: npm run bench.</text>
</svg>
